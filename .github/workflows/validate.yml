name: Phase 1 validation
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet --info
      - run: dotnet restore PAVops.slnx --locked-mode
      - run: dotnet build PAVops.slnx -c Release --no-restore
      - run: dotnet test tests/PAVops.Tests -c Release --no-build --logger trx --results-directory artifacts/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: artifacts/
